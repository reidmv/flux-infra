apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eval-hpa
  namespace: flux-merge-eval
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eval-target
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
