apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-target
  namespace: flux-merge-eval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eval-target
  template:
    metadata:
      labels:
        app: eval-target
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
